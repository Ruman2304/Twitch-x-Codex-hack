services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dareloop
      POSTGRES_USER: dareloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or the compose env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dareloop_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dareloop -d dareloop"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dareloop_pg:
